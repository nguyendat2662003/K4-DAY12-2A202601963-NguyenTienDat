# CI/CD — chạy test, build image, rồi mới deploy.
#
# Cổng chất lượng: `deploy` khai `needs: [test, build]` nên nó chỉ chạy khi hai
# job kia đã xanh. Không còn cảnh code hỏng vẫn lên production.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ───────────────────────────────────────────────────────────
  # 1. Test — chạy trên mọi push và mọi pull request
  # ───────────────────────────────────────────────────────────
  test:
    name: Chạy test
    runs-on: ubuntu-latest
    steps:
      - name: Lấy source
        uses: actions/checkout@v4

      - name: Cài Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài dependency
        run: pip install -r requirements.txt

      # Bỏ test_cp5.py: nó gọi vào service đã deploy qua Internet nên trong CI
      # sẽ đỏ hoặc phụ thuộc mạng. Bỏ test_bonus_cicd.py: nó kiểm tra badge,
      # mà badge chỉ xanh SAU khi lần chạy này xong — chạy ở đây là vòng lặp
      # luẩn quẩn. `-m "not docker"` nhường việc build image cho job sau.
      - name: Chạy pytest
        run: pytest tests/ -v --ignore=tests/test_cp5.py --ignore=tests/test_bonus_cicd.py -m "not docker"

  # ───────────────────────────────────────────────────────────
  # 2. Build — Dockerfile hỏng mà tới lúc deploy mới biết là quá muộn
  # ───────────────────────────────────────────────────────────
  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Lấy source
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t day12-chat:ci .

      - name: Kiểm tra image dưới 400MB
        run: |
          BYTES=$(docker image inspect day12-chat:ci --format '{{.Size}}')
          MEGABYTES=$((BYTES / 1024 / 1024))
          echo "Dung lượng image: ${MEGABYTES} MB"
          if [ "$MEGABYTES" -ge 400 ]; then
            echo "::error::Image ${MEGABYTES}MB vượt ngưỡng 400MB"
            exit 1
          fi

  # ───────────────────────────────────────────────────────────
  # 3. Deploy — chỉ từ nhánh main, chỉ khi test và build đã xanh
  # ───────────────────────────────────────────────────────────
  deploy:
    name: Deploy lên Render
    runs-on: ubuntu-latest
    needs: [test, build]
    # Mở pull request không được kéo theo một lần deploy
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Gọi deploy hook của Render
        env:
          # Giá trị nằm ở Settings → Secrets and variables → Actions,
          # không bao giờ nằm trong file này
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::Chưa cấu hình RENDER_DEPLOY_HOOK — bỏ qua bước deploy"
            exit 0
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
          echo "Đã kích hoạt deploy trên Render"
